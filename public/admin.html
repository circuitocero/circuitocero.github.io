<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin — CIRCUITO CERO®</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<link rel="stylesheet" href="style.css">
<style>
  .admin-box{padding:14px;}
  .form-card{background:var(--surface);border-radius:14px;padding:14px;border:1px solid var(--border);margin-bottom:18px;}
  .form-title{font-family:var(--disp);font-size:1rem;font-weight:800;margin-bottom:10px;}
  .field{margin-bottom:10px;}
  .field label{font-family:var(--mono);font-size:.6rem;color:var(--muted);display:block;margin-bottom:4px;}
  .field input, .field select{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:9px;border-radius:8px;font-size:.8rem;outline:none;}
  .btn-pub{width:100%;background:var(--red);color:#fff;border:none;font-family:var(--disp);font-size:.85rem;font-weight:800;padding:12px;border-radius:10px;cursor:pointer;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <div class="tb-name">PANEL <span>ADMIN</span></div>
    <a href="index.html" style="font-family:var(--mono);font-size:.65rem;color:var(--muted);text-decoration:none;">Ver sitio</a>
  </div>
</header>

<main class="admin-box">
  <section class="form-card">
    <div class="form-title">Subir Nuevo Proyecto</div>
    <form id="admin-upload-form">
      <div class="field">
        <label>Título del contenido</label>
        <input type="text" id="title" placeholder="Ej: Control de Puente H con ESP32" required>
      </div>
      <div class="field">
        <label>Categoría</label>
        <select id="category">
          <option value="Electrónica">Electrónica</option>
          <option value="Robótica">Robótica</option>
          <option value="Programación">Programación</option>
        </select>
      </div>
      <div class="field">
        <label>Tipo de Recurso</label>
        <select id="type">
          <option value="video">Video</option>
          <option value="document">Documento PDF / Esquema</option>
        </select>
      </div>
      <div class="field">
        <label>Portada (Thumbnail)</label>
        <input type="file" id="thumbFile" accept="image/*" required>
      </div>
      <div class="field">
        <label>Archivo de Video o Documento</label>
        <input type="file" id="contentFile" accept="video/*,.pdf" required>
      </div>
      <button type="submit" class="btn-pub">Publicar Recurso</button>
    </form>
  </section>

  <section>
    <div class="form-title">Gestionar Contenido en Supabase</div>
    <div id="admin-list"></div>
  </section>
</main>

<script>
const form = document.getElementById('admin-upload-form');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData();
  formData.append('title', document.getElementById('title').value);
  formData.append('category', document.getElementById('category').value);
  formData.append('type', document.getElementById('type').value);
  formData.append('thumbFile', document.getElementById('thumbFile').files[0]);
  formData.append('contentFile', document.getElementById('contentFile').files[0]);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const result = await res.json();
    if(result.success) {
      alert('¡Publicación registrada en la nube exitosamente!');
      form.reset();
      loadAdminList();
    }
  } catch (err) {
    alert('Error al intentar subir el archivo.');
  }
});

async function loadAdminList() {
  const container = document.getElementById('admin-list');
  const res = await fetch('/api/posts');
  const data = await res.json();
  
  if(!data.posts) return;

  container.innerHTML = data.posts.map(post => `
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);padding:10px;border-radius:8px;margin-bottom:6px;border:1px solid var(--border);">
      <div>
        <div style="font-family:var(--disp);font-size:.8rem;font-weight:700;">${post.title}</div>
        <div style="font-family:var(--mono);font-size:.55rem;color:var(--muted);">${post.category}</div>
      </div>
      <button class="btn-del" onclick="deletePost(${post.id})">Eliminar</button>
    </div>
  `).join('');
}

async function deletePost(id) {
  if(confirm('¿Deseas eliminar esta publicación de Supabase?')) {
    await fetch(`/api/posts/${id}`, { method: 'DELETE' });
    loadAdminList();
  }
}

window.addEventListener('DOMContentLoaded', loadAdminList);
</script>
</body>
</html>
